<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask Her Out</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #fbe4e8;
      overflow: hidden;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    .gif-container {
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .gif-container img {
      max-height: 100%;
      max-width: 100%;
      border-radius: 12px;
      object-fit: contain;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }

    p {
      font-size: 14px;
      color: #666;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 50px;
      position: relative;
    }

    button {
      padding: 10px 25px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .yes-btn {
      background-color: #e0e0e0;
      color: #333;
    }

    .yes-btn:hover {
      background-color: #d0d0d0;
    }

    .no-btn {
      background-color: #e0e0e0;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="gif-container">
      <img id="gif" src="https://media.tenor.com/gU212Jy34EAAAAAM/tkthao219-bubududu.gif" alt="Cute GIF">
    </div>
    <h1 id="question">DO you love me? 😉</h1>
    <p id="subtext">~Shivam is all yours</p>

    <div class="btn-group" id="btnGroup">
      <button class="yes-btn" id="yesBtn">Yes</button>
      <button class="no-btn" id="noBtn">No</button>
    </div>
  </div>

  <script>
    const steps = [
      {
        gif: "https://media.tenor.com/gU212Jy34EAAAAAM/tkthao219-bubududu.gif",
        title: "DO you love me? 😉",
        subtext: "~Shivam is all yours"
      },
      {
        gif: "https://media.tenor.com/5mR32793hCgAAAAAM/peach-goma.gif",
        title: "Please think again! 😉",
        subtext: "Itni jaldi nahi matt bolo 🥹"
      },
      {
        gif: "https://media.tenor.com/Un30K3z0eK4AAAAAM/sad-cute.gif",
        title: "Ek aur baar Soch lo! 😫",
        subtext: "Kyu aisa kar rahi ho 🥺"
      },
      {
        gif: "https://media.tenor.com/4q61Z1aN7HAAAAAM/bubu-dudu-bubu.gif",
        title: "Baby Man jao na! Kitna bhav khaogi 😭",
        subtext: "Bhut git baat hai yaar 😭"
      }
    ];

    let currentStep = 0;

    const gifImg = document.getElementById("gif");
    const questionText = document.getElementById("question");
    const subtextText = document.getElementById("subtext");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    noBtn.addEventListener("click", () => {
      if (currentStep < steps.length - 1) {
        currentStep++;
        gifImg.src = steps[currentStep].gif;
        questionText.textContent = steps[currentStep].title;
        subtextText.textContent = steps[currentStep].subtext;
      }

      if (currentStep === steps.length - 1) {
        enableDodgingNoBtn();
      }
    });

    function enableDodgingNoBtn() {
      noBtn.style.position = "absolute";
      
      const moveNoBtn = () => {
        const card = document.getElementById("card");
        const cardRect = card.getBoundingClientRect();
        const btnRect = noBtn.getBoundingClientRect();

        const maxX = cardRect.width - btnRect.width - 20;
        const maxY = cardRect.height - btnRect.height - 20;

        const randomX = Math.floor(Math.random() * maxX) - (cardRect.width / 2 - btnRect.width);
        const randomY = Math.floor(Math.random() * maxY) - (cardRect.height / 2 - btnRect.height);

        noBtn.style.left = `${randomX}px`;
        noBtn.style.top = `${randomY}px`;
      };

      noBtn.addEventListener("mouseenter", moveNoBtn);
      noBtn.addEventListener("click", moveNoBtn);
    }

    yesBtn.addEventListener("click", () => {
      gifImg.src = "https://media.tenor.com/gU212Jy34EAAAAAM/tkthao219-bubududu.gif";
      questionText.textContent = "Hehehehe, I knew it! Love you a lot 😘";
      subtextText.textContent = "LOVE YOU SO MUCH";
      noBtn.style.display = "none";
    });
  </script>
</body>
</html>
